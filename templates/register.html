<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cont nou — AI Marketing Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #16161f;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #8888aa; text-align: center; margin-bottom: 28px; }
    label { display: block; font-size: 13px; color: #8888aa; margin-bottom: 6px; margin-top: 16px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #0f0f18;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #e8e8f0;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #4f46e5; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .9; }
    .link-row {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #8888aa;
    }
    .link-row a { color: #7c6aed; text-decoration: none; }
    .link-row a:hover { text-decoration: underline; }
    .flash { font-size: 13px; color: #ff6b6b; background: #1a0f0f; border: 1px solid #3a1a1a; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
    .hint { font-size: 11px; color: #555577; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🤖</div>
    <h1>Creează cont</h1>
    <p class="subtitle">Înregistrează-te pentru a începe</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <label for="username">Nume utilizator</label>
      <input type="text" id="username" name="username" autocomplete="username" minlength="3" required>
      <p class="hint">Minim 3 caractere</p>

      <label for="password">Parolă</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
      <p class="hint">Minim 6 caractere</p>

      <label for="confirm_password">Confirmă parola</label>
      <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>

      <button type="submit" class="btn">Creează cont</button>
    </form>

    <p class="link-row">Ai deja cont? <a href="{{ url_for('login') }}">Autentifică-te</a></p>
  </div>
</body>
</html>
